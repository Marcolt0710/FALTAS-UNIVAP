name: Check-in de presença

# Disparado pelo Atalho do iPhone via repository_dispatch (evento "checkin")
# quando você chega na faculdade. Não roda o Playwright — só lê/atualiza o
# Gist de cache e republica o dashboard, então é rápido (segundos).
on:
  repository_dispatch:
    types: [checkin]

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Registrar check-in e montar dashboard
        env:
          GIST_ID: ${{ vars.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        working-directory: scraper
        run: python checkin.py

      # Compara com o data.json que está no ar e marca o que mudou (selo
      # "novo" no painel). No cron diário também manda push pelo ntfy.
      - name: Manter as novidades marcadas
        env:
          PAINEL_URL: ${{ vars.PAINEL_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper/mudancas.py --sem-aviso

      # data.json fica só no runner e no deploy da Vercel — nunca é
      # commitado no repositório, então dados pessoais não vazam no git.
      - name: Publicar na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy docs --prod --yes --token "$VERCEL_TOKEN"
