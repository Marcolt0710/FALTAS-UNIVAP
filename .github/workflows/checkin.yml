name: Check-in de presença

# Disparado pelo Atalho do iPhone via repository_dispatch (evento "checkin")
# quando você chega na faculdade. Não roda o Playwright — só lê/atualiza o
# Gist de cache e republica o dashboard, então é rápido (segundos).
on:
  repository_dispatch:
    types: [checkin]

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Registrar check-in e montar dashboard
        env:
          GIST_ID: ${{ vars.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        working-directory: scraper
        run: python checkin.py

      # data.json fica só no runner e no deploy da Netlify — nunca é
      # commitado no repositório, então dados pessoais não vazam no git.
      - name: Publicar na Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --prod --dir docs --no-build --message "Atualização automática"
