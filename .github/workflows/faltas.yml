name: Atualizar faltas

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 09:00 UTC (~06:00 em Brasília)
  workflow_dispatch: {}    # permite rodar manualmente pelo GitHub

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Rodar scraper
        env:
          UNIVAP_USER: ${{ secrets.UNIVAP_USER }}
          UNIVAP_PASS: ${{ secrets.UNIVAP_PASS }}
        run: python scraper/scrape.py

      - name: Sincronizar cache no Gist (preserva check-ins de presença)
        if: ${{ vars.GIST_ID != '' }}
        env:
          GIST_ID: ${{ vars.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        working-directory: scraper
        run: python sync_cache.py

      - name: Upload debug (só se a extração vier vazia)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      # data.json fica só no runner e no deploy da Netlify — nunca é
      # commitado no repositório, então dados pessoais não vazam no git.
      - name: Publicar na Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --prod --dir docs --no-build --message "Atualização automática"
